<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube Downloader</title>
<meta name="description" content="Download YouTube videos in full quality.">
<meta name="theme-color" content="#e4e7eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Downloader">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e4e7eb;
    --panel: #ffffff;
    --ink: #161a22;
    --muted: #5c6470;
    --line: #cdd2d9;
    --track: #e9ecf0;
    --video: #2747d0;
    --audio: #d98e0b;
    --audio-ink: #946000;
    --danger: #c2362b;
    --wide: 116%;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --panel: #1a1e26;
      --ink: #e8ebf0;
      --muted: #98a0ab;
      --line: #2c323c;
      --track: #262b35;
      --video: #5b7bff;
      --audio: #f2b23a;
      --audio-ink: #f2b23a;
      --danger: #ff7a6e;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 700px; margin: 0 auto; padding: max(36px, env(safe-area-inset-top)) 16px 48px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- masthead */
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-stretch: var(--wide); font-size: 15px; }
  .brand svg { display: block; }
  h1 {
    margin: 40px 0 14px;
    font-size: clamp(30px, 5.4vw, 42px);
    line-height: 1.06;
    font-weight: 720;
    font-stretch: 112%;
    letter-spacing: -0.015em;
    max-width: 19ch;
  }
  .points { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 28px; padding: 0; }
  .points li { font-size: 14px; font-weight: 600; padding: 5px 12px 5px 10px; border-radius: 99px; background: var(--panel);
               display: inline-flex; align-items: center; gap: 7px; }
  .points li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot); }
  .points li:nth-child(1) { --dot: var(--video); }
  .points li:nth-child(2) { --dot: var(--ink); }
  .points li:nth-child(3) { --dot: var(--audio); }

  /* ---------- inputs */
  .bar-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .field {
    display: flex; align-items: center; min-width: 0;
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px;
  }
  .field:focus-within { border-color: var(--ink); }
  .field input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink);
    font: inherit; font-size: 16px; padding: 14px;
  }
  .field input::placeholder { color: var(--muted); opacity: .85; }
  .field input::-webkit-search-cancel-button { display: none; }

  button, .btn {
    font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border-radius: 10px;
    padding: 12px 18px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--panel);
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button:disabled { opacity: .45; cursor: default; }
  .quiet { background: transparent; color: var(--ink); border-color: var(--line); }
  .quiet:hover:not(:disabled) { border-color: var(--ink); }
  .paste { border: 0; background: none; color: var(--muted); font-weight: 500; padding: 8px 14px; }
  .paste:hover { color: var(--ink); }
  :focus-visible { outline: 2px solid var(--video); outline-offset: 2px; }

  .msg { margin: 12px 0 0; font-size: 15px; color: var(--muted); }
  .msg.error { color: var(--danger); }
  .msg:empty { display: none; }

  /* ---------- search results */
  .results { margin-top: 20px; display: grid; gap: 6px; }
  .result {
    display: grid; grid-template-columns: 128px 1fr; gap: 14px; align-items: center; text-align: left;
    width: 100%; padding: 8px; border-radius: 12px; border: 0; background: var(--panel); color: var(--ink);
    font-weight: 400;
  }
  .result:hover { box-shadow: inset 0 0 0 1.5px var(--line); }
  .result img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 7px; background: var(--track); display: block; }
  .result b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; font-size: 15px; line-height: 1.3; }
  .result small { display: flex; gap: 10px; color: var(--muted); font-size: 13px; margin-top: 3px; }

  /* ---------- video panel */
  .video { margin-top: 24px; background: var(--panel); border-radius: 16px; padding: 22px; }
  .clip { display: grid; grid-template-columns: 168px 1fr; gap: 16px; align-items: start; }
  .thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--track); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb span {
    position: absolute; right: 6px; bottom: 6px; padding: 1px 6px; border-radius: 4px;
    background: rgba(10, 12, 16, .82); color: #fff; font-size: 12px; font-weight: 600;
  }
  .clip h2 {
    margin: 0; font-size: 17px; line-height: 1.3; font-weight: 650;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .clip p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  /* ---------- format choice */
  .seg { display: flex; padding: 3px; gap: 3px; border-radius: 11px; background: var(--track); margin: 22px 0 0; border: 0; min-width: 0; }
  .seg label { position: relative; cursor: pointer; flex: 1; text-align: center; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span { display: block; padding: 9px 8px; border-radius: 8px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .seg input:checked + span { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .seg input:focus-visible + span { outline: 2px solid var(--video); outline-offset: 1px; }
  .seg input:disabled + span { opacity: .4; cursor: default; }
  .hint { margin: 8px 2px 0; color: var(--muted); font-size: 14px; }

  /* ---------- the stream diagram: two lanes that join into one file */
  .flow {
    --head: 26px; --bar: 10px;
    display: grid; grid-template-columns: 1fr 44px auto;
    row-gap: 18px; margin: 22px 0;
  }
  .lane { grid-column: 1; min-width: 0; }
  .lane.v { grid-row: 1; --c: var(--video); }
  .lane.a { grid-row: 2; --c: var(--audio); --ct: var(--audio-ink); }
  .lane-head { height: var(--head); display: flex; align-items: baseline; gap: 12px; white-space: nowrap; overflow: hidden; }
  .lane-head .kind { font-weight: 650; font-size: 14px; color: var(--ct, var(--c)); min-width: 44px; }
  .spec { display: flex; align-items: baseline; gap: 12px; min-width: 0; overflow: hidden; color: var(--muted); font-size: 14px; }
  .spec b { color: var(--ink); font-weight: 700; font-stretch: var(--wide); font-size: 17px; }
  .spec .tag { color: var(--ink); font-weight: 650; }
  .lane-head .pct { margin-left: auto; font-size: 13px; color: var(--muted); }
  .bar { height: var(--bar); border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--c); border-radius: inherit; transition: width .35s linear; }
  .lane.off { opacity: .38; }
  .lane.off .bar i { width: 0 !important; }

  .join { grid-column: 2; grid-row: 1 / 3; position: relative; }
  .join span { position: absolute; border: 0 solid var(--line); transition: border-color .3s; }
  .join .jv { left: 0; width: 50%; top: calc(var(--head) + var(--bar) / 2 - 1px);
              height: calc(50% - var(--head) / 2 + 2px); border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 12px; }
  .join .ja { left: 0; width: 50%; bottom: calc(var(--bar) / 2 - 1px);
              height: calc(50% - var(--head) / 2 + 2px); border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 12px; }
  .join .js { left: calc(50% - 1px); right: 0; top: calc(50% + var(--head) / 2 - 1px); border-top-width: 2px; }
  .flow .v.complete ~ .join .jv { border-color: var(--video); }
  .flow .a.complete ~ .join .ja { border-color: var(--audio); }
  .flow.joining .join .js, .flow.done .join .js { border-color: var(--ink); }
  .flow.audio-only .join .jv { border-color: transparent; }

  .file {
    /* centred on the join's outlet, which sits half a lane-head below the grid's middle */
    grid-column: 3; grid-row: 1 / 3; align-self: center; margin-top: var(--head);
    width: 132px; padding: 10px 14px; border-radius: 10px;
    border: 2px dashed var(--line); color: var(--muted);
    transition: background .3s, color .3s, border-color .3s;
  }
  .file .ext { display: block; font-size: 22px; line-height: 1.1; font-weight: 750; font-stretch: var(--wide); color: var(--ink); }
  .file .fsize { display: block; font-size: 13px; margin-top: 2px; }
  .flow.joining .file { border-style: solid; border-color: var(--ink); }
  .flow.done .file { background: var(--ink); border: 2px solid var(--ink); color: var(--panel); }
  .flow.done .file .ext { color: var(--panel); }

  /* ---------- action */
  .act { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .act .go { padding: 14px 30px; font-size: 16px; }
  .status { font-size: 14px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .status strong { color: var(--ink); font-weight: 600; }

  .done-box { margin-top: 16px; font-size: 15px; }
  .done-box .name { font-weight: 600; word-break: break-word; }
  .done-box .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
          animation: r .7s linear infinite; flex: none; }
  @keyframes r { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    main { padding-top: max(22px, env(safe-area-inset-top)); }
    h1 { margin-top: 28px; }
    .video { padding: 16px; }
    .clip { grid-template-columns: 116px 1fr; gap: 12px; }
    .clip h2 { font-size: 15px; }
    .result { grid-template-columns: 112px 1fr; gap: 12px; }
    .flow { grid-template-columns: 1fr; }
    .lane-head { height: auto; flex-wrap: wrap; row-gap: 2px; margin-bottom: 6px; white-space: normal; }
    .spec { flex-wrap: wrap; row-gap: 0; overflow: visible; }
    .join { display: none; }
    .file { grid-column: 1; grid-row: 3; margin-top: 0; width: auto; display: flex; align-items: baseline; gap: 10px; }
    .seg span { padding: 9px 4px; font-size: 14px; }
    .act .go { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation-duration: 1.5s !important; }
  }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4 9h9c3.5 0 4.5 7 8 7h7" stroke="var(--video)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M4 23h9c3.5 0 4.5-7 8-7" stroke="var(--audio)" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    YouTube Downloader
  </div>

  <h1>Download any YouTube video in full quality without Sourav</h1>
  <ul class="points">
    <li>Highest resolution</li>
    <li>Every frame</li>
    <li>Original audio</li>
  </ul>

  <form class="bar-form" id="gate" hidden>
    <label for="pw" class="sr">Family password</label>
    <div class="field"><input id="pw" type="password" placeholder="Family password" autocomplete="current-password" required></div>
    <button type="submit">Unlock</button>
  </form>

  <form class="bar-form" id="findForm" autocomplete="off">
    <label for="q" class="sr">YouTube link or search words</label>
    <div class="field">
      <input id="q" type="search" enterkeyhint="go" placeholder="Paste a link or search YouTube" required>
      <button type="button" class="paste" id="pasteBtn">Paste</button>
    </div>
    <button id="findBtn" type="submit">Find</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <div class="results" id="results" hidden></div>

  <section class="video" id="video" hidden>
    <div class="clip">
      <div class="thumb"><img id="thumb" alt=""><span id="dur"></span></div>
      <div>
        <h2 id="title"></h2>
        <p id="channel"></p>
      </div>
    </div>

    <fieldset class="seg">
      <legend class="sr">Format</legend>
      <label><input type="radio" name="mode" value="best" checked><span>Best quality</span></label>
      <label><input type="radio" name="mode" value="compat"><span>Plays everywhere</span></label>
      <label><input type="radio" name="mode" value="audio"><span>Audio</span></label>
    </fieldset>
    <p class="hint" id="hint"></p>

    <div class="flow" id="flow" aria-label="Streams that will be downloaded">
      <div class="lane v" id="laneV">
        <div class="lane-head"><span class="kind">Video</span><span class="spec" id="specV"></span><span class="pct" id="pctV"></span></div>
        <div class="bar"><i id="fillV"></i></div>
      </div>
      <div class="lane a" id="laneA">
        <div class="lane-head"><span class="kind">Audio</span><span class="spec" id="specA"></span><span class="pct" id="pctA"></span></div>
        <div class="bar"><i id="fillA"></i></div>
      </div>
      <div class="join" aria-hidden="true"><span class="jv"></span><span class="ja"></span><span class="js"></span></div>
      <div class="file"><span class="ext" id="ext">.mp4</span><span class="fsize" id="fsize"></span></div>
    </div>

    <div class="act">
      <button class="go" id="goBtn">Download</button>
      <div class="status" id="status" aria-live="polite"></div>
    </div>

    <div class="done-box" id="doneBox" hidden>
      <div class="name" id="fileName"></div>
      <div class="row">
        <a class="btn quiet" id="again" href="#">Save again</a>
        <button type="button" class="quiet" id="another">New video</button>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const HINTS = {
  best: "Highest resolution and frame rate. If it won't play, use VLC.",
  compat: "Plays on any phone, TV or computer.",
  audio: "Just the sound, as an M4A file.",
};
const ACTIVE_KEY = "ytd.active";
let current = null, info = null, busy = false, lastResults = null;

const mode = () => document.querySelector('input[name="mode"]:checked').value;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function setMsg(text, isError = false) { $("msg").textContent = text || ""; $("msg").classList.toggle("error", !!isError); }
function fmtTime(s) {
  if (s == null) return "";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
}
function fmtSize(b) {
  if (!b) return "";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(i >= 3 ? 2 : i ? 1 : 0) + " " + u[i];
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function store(v) { try { v ? localStorage.setItem(ACTIVE_KEY, JSON.stringify(v)) : localStorage.removeItem(ACTIVE_KEY); } catch {} }
function stored() { try { return JSON.parse(localStorage.getItem(ACTIVE_KEY) || "null"); } catch { return null; } }
function friendly(e) { return e.message === "Failed to fetch" || e.name === "TypeError" ? "No connection to the server. Try again." : e.message; }

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : { cache: "no-store" });
  let data = {};
  try { data = await r.json(); } catch {}
  if (data.locked) lockPage(true);
  return { r, data };
}

/* ---------- password */
function lockPage(on) {
  $("gate").hidden = !on;
  $("findForm").hidden = on;
  if (on) { $("video").hidden = true; $("results").hidden = true; }
  (on ? $("pw") : $("q")).focus({ preventScroll: true });
}
$("gate").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("gate").querySelector("button");
  btn.disabled = true;
  try {
    const { r } = await api("/api/login", { password: $("pw").value });
    if (r.ok) { setMsg(""); $("pw").value = ""; lockPage(false); afterUnlock(); }
    else { setMsg("Wrong password.", true); $("pw").select(); }
  } catch { setMsg("No connection. Try again.", true); }
  finally { btn.disabled = false; }
});

/* ---------- find: link or search */
async function find(text) {
  text = (text || "").trim();
  if (busy || !text) return;
  if (text === current && info) return;
  setMsg("");
  const btn = $("findBtn");
  btn.disabled = true;
  btn.replaceChildren(el("span", "spin"), document.createTextNode("Finding"));
  try {
    const { r, data } = await api("/api/lookup", { q: text });
    if (!r.ok) throw new Error(data.error || "That didn't work. Check the link and try again.");
    if (data.kind === "results") showResults(data.results);
    else showVideo(data.video, text);
  } catch (e) {
    setMsg(friendly(e), true);
  } finally {
    btn.disabled = false; btn.textContent = "Find";
  }
}

function showResults(list) {
  lastResults = list;
  info = null; current = null;
  $("video").hidden = true;
  const box = $("results");
  box.replaceChildren(...list.map((v) => {
    const b = el("button", "result");
    b.type = "button";
    const img = el("img"); img.src = v.thumbnail; img.alt = ""; img.loading = "lazy";
    const text = el("div");
    const meta = el("small");
    if (v.channel) meta.append(el("span", "", v.channel));
    if (v.duration) meta.append(el("span", "", fmtTime(v.duration)));
    text.append(el("b", "", v.title || "Untitled video"), meta);
    b.append(img, text);
    b.addEventListener("click", () => { $("q").value = v.url; find(v.url); });
    return b;
  }));
  box.hidden = false;
}

function showVideo(v, url) {
  if (v.is_live) throw new Error("This is a live stream. It can be downloaded after it ends.");
  info = v; current = url;
  $("results").hidden = true;
  $("thumb").src = v.thumbnail || "";
  $("dur").textContent = fmtTime(v.duration); $("dur").hidden = !v.duration;
  $("title").textContent = v.title || "Untitled video";
  $("channel").textContent = v.channel || "";
  const radios = [...document.querySelectorAll('input[name="mode"]')];
  radios.forEach((i) => { i.disabled = !v.modes[i.value]; });
  if (document.querySelector('input[name="mode"]:checked').disabled) {
    const first = radios.find((i) => !i.disabled);
    if (first) first.checked = true;
  }
  resetJob(); renderFlow();
  $("video").hidden = false;
  $("video").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ---------- the stream diagram */
function renderFlow() {
  const m = mode(), p = info.modes[m] || {};
  const v = p.video, a = p.audio;
  const sv = $("specV"); sv.replaceChildren();
  if (v) {
    sv.append(el("b", "", v.width && v.height ? `${v.width} × ${v.height}` : "Video"));
    if (v.fps) sv.append(el("span", v.fps >= 50 ? "tag" : "", Math.round(v.fps) + " fps"));
    if (v.hdr) sv.append(el("span", "tag", "HDR"));
    if (v.codec) sv.append(el("span", "", v.codec));
  } else sv.append(el("span", "", m === "audio" ? "Not included" : "Not available"));
  const sa = $("specA"); sa.replaceChildren();
  if (a) {
    sa.append(el("b", "", a.kbps ? a.kbps + " kbps" : a.codec));
    if (a.codec && a.kbps) sa.append(el("span", "", a.codec));
    if (a.channels) sa.append(el("span", "", a.channels === 1 ? "mono" : a.channels === 2 ? "stereo" : a.channels === 6 ? "5.1" : a.channels + " ch"));
    if (a.khz) sa.append(el("span", "", a.khz + " kHz"));
  } else sa.append(el("span", "", "Inside the video stream"));
  $("laneV").classList.toggle("off", m === "audio");
  $("flow").classList.toggle("audio-only", m === "audio");
  $("ext").textContent = "." + (p.ext || "mp4");
  $("fsize").textContent = p.size ? "about " + fmtSize(p.size) : "";
  $("hint").textContent = HINTS[m];
}

function setLane(which, pct) {
  pct = Math.max(0, Math.min(100, pct || 0));
  $("fill" + which).style.width = pct + "%";
  $("pct" + which).textContent = pct > 0 && pct < 100 ? Math.floor(pct) + "%" : "";
  $(which === "V" ? "laneV" : "laneA").classList.toggle("complete", pct >= 100);
}
function resetJob() {
  setLane("V", 0); setLane("A", 0);
  $("flow").classList.remove("joining", "done");
  $("status").replaceChildren();
  $("doneBox").hidden = true;
  $("goBtn").hidden = false;
}
function setStatus(...parts) {
  const s = $("status"); s.replaceChildren();
  parts.filter(Boolean).forEach((t, i) => s.append(el(i ? "span" : "strong", "", t)));
}
function showProgress(p, m) {
  if (p.kind === "video") setLane("V", p.part_pct);
  if (p.kind === "audio") { if (m !== "audio" && info.modes[m] && info.modes[m].video) setLane("V", 100); setLane("A", p.part_pct); }
  if (p.phase === "join") { if (m !== "audio") setLane("V", 100); setLane("A", 100); $("flow").classList.add("joining"); }
  setStatus(p.stage || "Starting",
            p.speed && !p.phase ? fmtSize(p.speed) + "/s" : "",
            p.total && !p.phase ? fmtSize(p.downloaded) + " of " + fmtSize(p.total) : "");
}

/* ---------- download, with reconnects */
function lockControls(on) {
  $("goBtn").disabled = on;
  $("findBtn").disabled = on;
  document.querySelectorAll('input[name="mode"]').forEach((i) => { i.disabled = on || !(info && info.modes[i.value]); });
}

async function pollJob(job, m) {
  let fails = 0;
  while (true) {
    await sleep(fails ? Math.min(10000, 800 * 2 ** fails) : 700);
    let res = null;
    try { res = await api("/api/progress/" + job); } catch {}
    if (!res || res.r.status >= 500) {
      if (++fails > 12) throw new Error("Lost connection to the server. Check your internet and try again.");
      setStatus("Reconnecting");
      continue;
    }
    fails = 0;
    const { r, data: p } = res;
    if (!r.ok) throw new Error(p.error || "The download stopped. Try again.");
    if (p.status === "error") throw new Error(p.error);
    if (p.status === "done") return p;
    showProgress(p, m);
  }
}

function finish(job, p, m) {
  if (m !== "audio") setLane("V", 100);
  setLane("A", 100);
  $("flow").classList.remove("joining"); $("flow").classList.add("done");
  $("fsize").textContent = fmtSize(p.size);
  const dot = p.file.lastIndexOf(".");
  if (dot > 0) $("ext").textContent = p.file.slice(dot);
  setStatus("Saved to Downloads");
  $("goBtn").hidden = true;
  const href = "/api/file/" + job;
  $("again").href = href;
  $("fileName").textContent = p.file;
  $("doneBox").hidden = false;
  const a = document.createElement("a"); a.href = href; a.download = p.file;
  document.body.append(a); a.click(); a.remove();
}

async function runDownload(existingJob) {
  if (!info || busy) return;
  busy = true;
  const m = mode();
  setMsg("");
  resetJob();
  lockControls(true);
  setStatus(existingJob ? "Resuming" : "Preparing");
  try {
    let job = existingJob;
    if (!job) {
      const { r, data } = await api("/api/download", { url: current, mode: m });
      if (!r.ok) throw new Error(data.error || "The download could not start.");
      job = data.job;
      store({ job, url: current, mode: m });
    }
    const p = await pollJob(job, m);
    store(null);
    finish(job, p, m);
  } catch (e) {
    store(null);
    resetJob();
    setMsg(friendly(e), true);
  } finally {
    busy = false;
    lockControls(false);
  }
}

/* ---------- wiring */
$("findForm").addEventListener("submit", (e) => { e.preventDefault(); find($("q").value); });
$("q").addEventListener("paste", () => setTimeout(() => { if (/youtu\.?be/i.test($("q").value)) find($("q").value); }, 0));
$("pasteBtn").addEventListener("click", async () => {
  try { const t = (await navigator.clipboard.readText()).trim(); $("q").value = t; find(t); }
  catch { $("q").focus(); setMsg("Press and hold in the box, then choose Paste."); }
});
$("goBtn").addEventListener("click", () => runDownload());
document.querySelectorAll('input[name="mode"]').forEach((i) => i.addEventListener("change", () => { if (info && !busy) { resetJob(); renderFlow(); } }));
$("another").addEventListener("click", () => {
  current = null; info = null; $("video").hidden = true; $("q").value = ""; $("q").focus();
  if (lastResults) $("results").hidden = false;
});

/* Links shared from the YouTube app arrive as ?text=... or ?url=... */
function sharedLink() {
  const params = new URLSearchParams(location.search);
  const blob = [params.get("url"), params.get("text"), params.get("title")].filter(Boolean).join(" ");
  const match = blob.match(/https?:\/\/\S*(?:youtube\.com|youtu\.be)\S*/i);
  if (params.toString()) history.replaceState(null, "", "/");
  return match ? match[0] : null;
}
const shared = sharedLink();

async function afterUnlock() {
  const active = stored();
  if (active) {
    $("q").value = active.url;
    await find(active.url);
    if (info) {
      const radio = document.querySelector(`input[name="mode"][value="${active.mode}"]`);
      if (radio && !radio.disabled) { radio.checked = true; renderFlow(); }
      runDownload(active.job);
    } else store(null);
  } else if (shared) {
    $("q").value = shared;
    find(shared);
  }
}

(async () => {
  try {
    const { data } = await api("/api/session");
    if (!data.ok) { lockPage(true); return; }
  } catch {}
  afterUnlock();
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
