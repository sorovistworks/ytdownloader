# Visits the site every 10 minutes so Render's free plan doesn't put it to sleep.
# Turn it on by adding a repository variable SITE_URL (Settings > Secrets and variables >
# Actions > Variables), e.g. https://youtube-downloader-xxxx.onrender.com
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Visit the site
        run: curl -fsS --retry 3 --max-time 90 "${{ vars.SITE_URL }}/api/health" || true
